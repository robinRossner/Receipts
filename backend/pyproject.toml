[project]
name = "receipts-server"
version = "0.1.0"
description = "Receipts server: photo upload, Claude extraction queue, offline-first sync, photo archive handover"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "apscheduler>=3.10,<4",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]

[tool.uv]
# Application, not a library: no build step, `server` is imported from the backend/ dir.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["receipts/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# prompts are ported verbatim from the Mac app; their lines are as long as the originals
"receipts/extraction/prompts.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["core", "receipts", "server"]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "typer.Option"]
