# XcodeGen spec for Receipts.xcodeproj (regenerate with `xcodegen generate`; the generated project is committed so
# opening it needs no tools). Two apps share Sources/ReceiptsApp: the Mac app (ReceiptsApp) and the iPhone app
# (ReceiptsiOS, only the files listed by its `excludes` are left out; iPhone-only code is in Sources/ReceiptsiOS).
# Package.swift builds the Mac sources and tests from the same folders.
name: Receipts
options:
  bundleIdPrefix: com.robinrossner
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: false
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ReceiptsApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/ReceiptsApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robin.receiptsapp
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
        SWIFT_EMIT_LOC_STRINGS: YES
  ReceiptsiOS:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: Sources/ReceiptsApp
        excludes:
          # Mac only: app entry, windows, panels, backup (Process), the local AI providers, dictionary editor
          - ReceiptsApp.swift
          - Database/BackupService.swift
          - Database/ReceiptStore+Data.swift
          - Database/DataExporter.swift
          - Pipeline/AnthropicAPIProvider.swift
          - Pipeline/ClaudeCLIProvider.swift
          - Pipeline/OllamaClient.swift
          - Pipeline/OllamaProcessManager.swift
          - Pipeline/OllamaProvider.swift
          - Views/ContentView.swift
          - Views/DictionaryEditorView.swift
          - Views/ExportSheet.swift
          - Views/ReceiptListView.swift
          - Views/ReviewView.swift
          - Views/SettingsView.swift
          - Views/UploadZoneView.swift
      - path: Sources/ReceiptsiOS
        excludes:
          - Resources/Info.plist
          - Resources/Info-Debug.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robinrossner.receipts
        PRODUCT_NAME: Receipts
        # The shared tests (@testable import ReceiptsApp) run against the iPhone app unchanged.
        PRODUCT_MODULE_NAME: ReceiptsApp
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        # Debug allows plain-HTTP localhost (testing against a backend on the Mac); Release is HTTPS only.
        Debug:
          INFOPLIST_FILE: Sources/ReceiptsiOS/Resources/Info-Debug.plist
        Release:
          INFOPLIST_FILE: Sources/ReceiptsiOS/Resources/Info.plist
    scheme:
      testTargets:
        - ReceiptsiOSTests
        - ReceiptsiOSUITests
      gatherCoverageData: false
  ReceiptsiOSTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: Tests/ReceiptsAppTests
        excludes:
          - E2ETests.swift            # needs the real backend (Tests/run-e2e.sh, macOS)
          - ClaudeCLIProviderTests.swift
      - path: Tests/ReceiptsiOSTests
    dependencies:
      - target: ReceiptsiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robinrossner.receipts.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Receipts.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Receipts"
        BUNDLE_LOADER: "$(TEST_HOST)"
  ReceiptsiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: Tests/ReceiptsiOSUITests
    dependencies:
      - target: ReceiptsiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robinrossner.receipts.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ReceiptsiOS
